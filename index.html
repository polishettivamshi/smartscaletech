<!doctype html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>SmartScaleTech | Digital Branding Agency & Career Services</title>
    <meta name="description" content="SmartScaleTech - Digital Branding Agency offering ATS resume writing, LinkedIn optimization, UI/UX design, and web development services. Empowering businesses and job seekers with professional digital presence." />
    <meta name="keywords" content="smartscaletech, smart scale tech, digital branding, ATS resume, LinkedIn optimization, web development, UI UX design, digital marketing agency" />
    <meta name="author" content="SmartScaleTech" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- Canonical URL (update with your domain) -->
    <link rel="canonical" href="https://smartscaletech.com" />
    
    <!-- Open Graph Tags (for Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartScaleTech | Digital Branding Agency & Career Services" />
    <meta property="og:description" content="Transform your digital presence with SmartScaleTech. Professional resume writing, LinkedIn optimization, and premium web development services." />
    <meta property="og:url" content="https://smartscaletech.com" />
    <meta property="og:site_name" content="SmartScaleTech" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartScaleTech | Digital Branding Agency & Career Services" />
    <meta name="twitter:description" content="Transform your digital presence with SmartScaleTech. Professional resume writing, LinkedIn optimization, and premium web development services." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect to CDNs for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SmartScaleTech",
      "url": "https://smartscaletech.com",
      "description": "Digital Branding Agency helping businesses and job seekers create a powerful digital presence",
      "sameAs": [
        "https://www.linkedin.com/company/smartscaletech",
        "https://twitter.com/smartscaletech",
        "https://www.instagram.com/smartscaletech"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "email": "contact@smartscaletech.com"
      }
    }
    </script>
    
    <!-- Local Business Schema (if applicable) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "SmartScaleTech",
      "description": "Digital Branding Agency",
      "url": "https://smartscaletech.com",
      "priceRange": "$$",
      "image": "https://smartscaletech.com/og-image.jpg"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
